server {
    listen 8093;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Font MIME types
    include /etc/nginx/mime.types;
    types {
        application/font-ttf ttf;
        font/ttf ttf;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/font-ttf;

    # API proxy to backend
    location /api/ {
        proxy_pass http://ai-fund-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
